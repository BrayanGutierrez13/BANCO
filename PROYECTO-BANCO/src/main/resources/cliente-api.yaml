openapi: 3.0.3
info:
  title: API del Banco
  version: 1.0.0
paths:
  /clientes:
    get:
      summary: "Lista todos los clientes"
      responses:
        '200':
          description: "Lista de clientes"
    post:
      summary: "Crea un nuevo cliente"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
      responses:
        '201':
          description: "Cliente creado"
components:
  schemas:
    Cliente:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
        telefono:
          type: string
        numeroCuenta:
          type: string
        saldo:
          type: number
          format: double
